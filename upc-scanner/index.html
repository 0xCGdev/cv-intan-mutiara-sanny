<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#155c3b" />
        <meta name="description" content="CV Intan Mutiara Sanny - UPC Scanner" />

        <title>CV IMS - UPC Scanner</title>

        <link rel="stylesheet" href="css/style.css" />

        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </head>

    <body>
        <section id="loginView" class="login">
            <div class="login-card">
                <div class="brand">
                    <div class="logo">
                        <img src="assets/Images/logo/logo.png" alt="Logo CV Intan Mutiara Sanny" />
                    </div>

                    <div>
                        <h1>UPC Scanner</h1>
                        <p>CV Intan Mutiara Sanny</p>
                    </div>
                </div>

                <label for="loginUser">Username</label>

                <input id="loginUser" class="input" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Masukkan username" />

                <label for="loginPass">Password</label>

                <input id="loginPass" class="input" type="password" autocomplete="current-password" placeholder="Masukkan password" />

                <button id="loginBtn" class="btn btn-primary full" type="button">Masuk</button>

                <div id="loginError" class="error-box hidden" role="alert"></div>
            </div>
        </section>

        <section id="appView" class="app hidden">
            <header class="topbar">
                <div class="top-left">
                    <div class="logo">
                        <img src="assets/Images/logo/logo.png" alt="Logo CV Intan Mutiara Sanny" />
                    </div>

                    <div>
                        <div class="top-title">UPC Scanner</div>

                        <div class="top-sub">CV Intan Mutiara Sanny</div>
                    </div>
                </div>

                <div class="top-actions">
                    <button id="notificationBtn" class="notification-btn" type="button" aria-label="Notifikasi">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>

                            <path d="M10 21h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                        </svg>

                        <span id="notificationBadge" class="notification-badge hidden"> 0 </span>
                    </button>

                    <button id="menuBtn" class="menu-btn" type="button" aria-label="Buka menu" aria-expanded="false">☰</button>
                </div>
            </header>

            <div id="menuOverlay" class="menu-overlay"></div>

            <div class="layout">
                <aside id="sidebar" class="sidebar">
                    <div class="sidebar-content">
                        <nav class="nav">
                            <button type="button" data-page="scan">
                                <span class="nav-icon">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <rect x="3" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"></rect>

                                        <rect x="14" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"></rect>

                                        <rect x="3" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"></rect>

                                        <rect x="14" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"></rect>
                                    </svg>
                                </span>

                                <span>Dashboard</span>
                            </button>

                            <button type="button" data-page="shipments">
                                <span class="nav-icon">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M4 5h16v14H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>

                                        <path d="M8 9h8M8 13h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                                    </svg>
                                </span>

                                <span>DPV</span>
                            </button>

                            <button type="button" data-page="packing">
                                <span class="nav-icon">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M4 7h16v13H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>

                                        <path d="m4 7 4-4h8l4 4M8 11h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                                    </svg>
                                </span>

                                <span>Packing</span>
                            </button>

                            <button type="button" data-page="loading">
                                <span class="nav-icon">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M3 7h11v10H3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>

                                        <path d="M14 10h4l3 3v4h-7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>

                                        <circle cx="7" cy="19" r="1.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle>

                                        <circle cx="18" cy="19" r="1.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
                                    </svg>
                                </span>

                                <span>Loading</span>
                            </button>

                            <button type="button" data-page="matching">
                                <span class="nav-icon">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M8 7h11M8 12h8M8 17h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>

                                        <path d="m4 7 .01 0M4 12 .01 12M4 17 .01 17" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></path>
                                    </svg>
                                </span>

                                <span>Matching</span>
                            </button>

                            <button type="button" data-page="master">
                                <span class="nav-icon">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M4 5h16v14H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>

                                        <path d="M8 9h8M8 13h8M8 17h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                                    </svg>
                                </span>

                                <span>Master Data</span>
                            </button>

                            <button type="button" data-page="users">
                                <span class="nav-icon">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M16 20v-1.5a4.5 4.5 0 0 0-4.5-4.5h-3A4.5 4.5 0 0 0 4 18.5V20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>

                                        <circle cx="10" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="1.8"></circle>

                                        <path d="M16 11a3 3 0 1 0 0-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>

                                        <path d="M16 14h1a4 4 0 0 1 4 4v2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                                    </svg>
                                </span>

                                <span>Petugas</span>
                            </button>
                        </nav>
                    </div>

                    <div class="sidebar-user">
                        <div class="sidebar-user-info">
                            <div id="sidebarUserName"></div>

                            <span id="sidebarUserRole"></span>
                        </div>

                        <button id="logoutBtn" class="sidebar-logout" type="button" aria-label="Keluar" title="Keluar">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M10 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>

                                <path d="M14 8l4 4-4 4M10 12h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </button>
                    </div>
                </aside>

                <main class="content">
                    <div id="page-scan">
                        <div class="page-head">
                            <h2>Dashboard</h2>

                            <p>Selamat datang di UPC Scanner.</p>
                        </div>
                    </div>

                    <div id="page-shipments" class="hidden"></div>
                    <!-- PACKING -->

                    <div id="page-packing" class="hidden"></div>

                    <div id="page-loading" class="hidden"></div>

                    <div id="page-matching" class="hidden"></div>

                    <div id="page-master" class="hidden">
                        <div class="page-head">
                            <h2>Master Data</h2>

                            <p>Data referensi UPC, SKU, dan nama barang.</p>
                        </div>

                        <section class="panel">
                            <div class="toolbar">
                                <input id="masterSearch" class="input" type="search" placeholder="Cari UPC, SKU, nama..." autocomplete="off" />

                                <button id="addMasterBtn" class="btn btn-primary" type="button">+ Tambah</button>
                            </div>

                            <div id="masterRows" class="table-wrap"></div>
                        </section>
                    </div>

                    <div id="page-users" class="hidden">
                        <div class="page-head">
                            <h2>Petugas</h2>

                            <p>Kelola akun yang dapat melakukan scanning.</p>
                        </div>

                        <section class="panel">
                            <div class="toolbar">
                                <button id="addUserBtn" class="btn btn-primary" type="button">+ Tambah Petugas</button>
                            </div>

                            <div id="userRows" class="table-wrap"></div>
                        </section>
                    </div>
                </main>
            </div>
        </section>

        <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
            <div id="modalContent" class="modal-card"></div>
        </div>

        <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

        <div id="loader" class="loader hidden" aria-hidden="true">
            <div class="spinner"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
